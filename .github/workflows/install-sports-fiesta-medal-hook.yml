name: Install Sports Fiesta Medal Hook
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add completion hook
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html");s=p.read_text(encoding="utf-8")
          marker='sports-fiesta-medal-hook.js?v=20260810b'
          tag='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-medal-hook.js?v=20260810b" data-practice="7" data-sport="Diving"></script>'
          if marker not in s:
              if "</body>" not in s: raise SystemExit("No closing body tag")
              s=s.replace("</body>",tag+"\n</body>",1);p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "Add Sports Fiesta medal completion hook" && git push
