name: Load New 2P Gold Rule
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'sports-fiesta-medal-hook-v4\.js\?v=[^"\']+', 'sports-fiesta-medal-hook-v4.js?v=20260811a', s)
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Load 2P final-score gold medal rule"
          git push
