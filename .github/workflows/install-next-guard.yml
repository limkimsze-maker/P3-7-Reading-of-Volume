name: Install Next Guard
on:
  push:
    paths:
      - '.github/workflows/install-next-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch Practice 7 runtime atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,base64,time,urllib.request,urllib.error,re
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; practice=7
          url=f'https://api.github.com/repos/{repo}/contents/index.html'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          tag=f'<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-next-guard-v1.js?v=20260812a" data-practice="{practice}"></script>'
          oldre=re.compile(r'\s*<script src="https://limkimsze-maker\.github\.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-2p-12-round-v1\.js\?v=[^"]+"></script>')
          for _ in range(12):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h)) as r:m=json.load(r)
              s=base64.b64decode(m['content']).decode(); s2=oldre.sub('',s)
              if 'sports-fiesta-next-guard-v1.js' not in s2:s2=s2.replace('</body>',tag+'\n</body>')
              if s2==s: raise SystemExit(0)
              p=json.dumps({'message':'Install shared Next guard','content':base64.b64encode(s2.encode()).decode(),'sha':m['sha'],'branch':'main'}).encode()
              req=urllib.request.Request(url,data=p,headers={**h,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req) as r:print(json.load(r)['commit']['sha'])
              raise SystemExit(0)
            except urllib.error.HTTPError as e:
              if e.code in (409,422):time.sleep(1.5);continue
              raise
          raise SystemExit('Could not patch after retries')
          PY
