name: Refresh Hardened Sports Fiesta Hook
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-sports-fiesta-hook.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force latest verified medal hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'sports-fiesta-medal-hook-v4.js' not in s: raise SystemExit('Sports Fiesta medal hook not found')
          s2=re.sub(r'(sports-fiesta-medal-hook-v4\.js)\?v=[^"\']+',r'\1?v=20260810e',s)
          if s2==s and '?v=20260810e' not in s: s2=s.replace('sports-fiesta-medal-hook-v4.js','sports-fiesta-medal-hook-v4.js?v=20260810e')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Load hardened Sports Fiesta medal hook"
          git push
