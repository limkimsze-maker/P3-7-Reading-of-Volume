name: Upgrade Mobile Fit V4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch to Sports Fiesta v4 mobile fit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('sports-fiesta-medal-hook-v3.js?v=20260810c','sports-fiesta-medal-hook-v4.js?v=20260810d')
          s=s.replace('sports-fiesta-medal-hook-v3.js','sports-fiesta-medal-hook-v4.js?v=20260810d')
          p.write_text(s,encoding='utf-8')
          print('changed',s!=old)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fit all game controls on portrait phones"
          git push
