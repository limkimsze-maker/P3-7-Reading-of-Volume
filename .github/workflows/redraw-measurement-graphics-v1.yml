name: Redraw Measurement Graphics V1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw measurement graphics
        run: |
          python .github/scripts/redraw_measurement_graphics_v1.py
          python .github/scripts/fix_syringe_orientation_v1.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Redraw Diving measurement graphics and correct syringe orientation"
          git push
